<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open in Cheffy</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F7F1E8">
  <link rel="icon" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Newsreader:ital,wght@0,400;0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/">cheffy<span>.</span></a>
    <nav class="nav" aria-label="Main"><a href="/">Home</a><a href="/#download">Join the iPhone Beta</a></nav>
  </header>
  <main class="card-page">
    <div class="card">
      <p class="eyebrow">Shared from Cheffy</p>
      <h1 id="title">Open this in Cheffy</h1>
      <p>Cheffy is a diary for what you cook, bake and pour. This link opens right in the app.</p>
      <a class="btn btn-light" id="open" href="cheffy://">Open in Cheffy</a>
      <a class="btn btn-ghost" data-get-app href="#">Join the iPhone Beta</a>
    </div>
  </main>
  <footer class="site-footer">
    <nav aria-label="Footer">
      <a href="mailto:hello@cheffy.me">Contact us</a>
      <a href="/privacy/">App privacy policy</a>
      <a href="/terms/">Terms of service</a>
    </nav>
  </footer>
  <script src="/site.js"></script>
  <script>
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var kind = parts[0], id = parts[1] || '';
      if ((kind === 'user' || kind === 'post') && /^[0-9a-f-]{36}$/i.test(id)) {
        document.getElementById('open').href = 'cheffy://' + kind + '/' + id;
        document.getElementById('title').textContent = kind === 'user' ? 'See this profile in Cheffy' : 'See this creation in Cheffy';
      }
    })();
  </script>
</body>
</html>
