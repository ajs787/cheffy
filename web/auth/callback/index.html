<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your email · Cheffy</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F7F1E8">
  <link rel="icon" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Newsreader:ital,wght@0,400;0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/">cheffy<span>.</span></a>
    <nav class="nav" aria-label="Main"><a href="/">Home</a><a href="/#download">Download Cheffy</a></nav>
  </header>
  <main class="card-page">
    <div class="card">
      <p class="eyebrow">Cheffy account</p>
      <h1 id="title">Almost there</h1>
      <p id="message">Open Cheffy on this iPhone to finish.</p>
      <a class="btn btn-light" id="open" href="cheffy://auth/callback">Open Cheffy</a>
      <p class="fine" id="fine">Opened this on a computer? Your email is confirmed — just sign in on your phone.</p>
    </div>
  </main>
  <footer class="site-footer">
    <nav aria-label="Footer">
      <a href="mailto:hello@cheffy.me">Contact us</a>
      <a href="/privacy/">App privacy policy</a>
      <a href="/terms/">Terms of service</a>
    </nav>
  </footer>
  <script src="/site.js"></script>
  <script>
    (function () {
      // Hand the exact query (code, type, or error) to the app's own callback screen.
      var q = new URLSearchParams(location.search);
      var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
      hash.forEach(function (v, k) { if (!q.has(k)) q.set(k, v); });
      var open = document.getElementById('open');
      open.href = 'cheffy://auth/callback' + (q.toString() ? '?' + q.toString() : '');
      var title = document.getElementById('title');
      var message = document.getElementById('message');
      var fine = document.getElementById('fine');
      if (q.get('error_code') === 'otp_expired') {
        title.textContent = 'This link has expired';
        message.textContent = 'Email links work once and expire after a while. Open Cheffy and sign in — it will offer to send a fresh one.';
        fine.hidden = true;
      } else if (q.get('error') || q.get('error_description')) {
        title.textContent = 'That link didn’t work';
        message.textContent = q.get('error_description') || 'Open Cheffy to try again.';
        fine.hidden = true;
      } else if (q.get('type') === 'recovery') {
        title.textContent = 'Reset your password';
        message.textContent = 'Open Cheffy on the iPhone where you asked for the reset.';
        fine.hidden = true;
      } else if (q.get('code')) {
        title.textContent = 'Email confirmed';
        message.textContent = 'Tap below to open Cheffy and set up your kitchen.';
      }
    })();
  </script>
</body>
</html>
